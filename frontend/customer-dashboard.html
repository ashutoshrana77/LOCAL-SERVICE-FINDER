<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard — Local Service Finder</title>
    <meta name="description" content="Manage upcoming and past bookings, quote requests, saved providers, reviews, messages, and profile settings." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <header id="site-header"></header>

    <main>
      <div class="container">
        <div class="dashboard-layout">
          <aside class="dashboard-sidebar" aria-label="Customer dashboard navigation">
            <div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);">
              <strong id="cust-user-name">Loading...</strong>
              <div id="cust-user-meta" class="muted" style="font-size:0.75rem;">Customer Account</div>
            </div>
            <nav class="tab-list" id="customer-tabs">
              <button type="button" class="tab-btn active" data-tab="bookings">Bookings <span id="count-bookings" class="mono">0</span></button>
              <button type="button" class="tab-btn" data-tab="quotes">Quote Requests <span id="count-quotes" class="mono">0</span></button>
              <button type="button" class="tab-btn" data-tab="favorites">Saved Providers <span id="count-favorites" class="mono">0</span></button>
              <button type="button" class="tab-btn" data-tab="reviews">Reviews to Write <span id="count-reviews" class="mono">0</span></button>
              <button type="button" class="tab-btn" data-tab="messages">Messages <span id="count-messages" class="mono">0</span></button>
              <button type="button" class="tab-btn" data-tab="notifications">Notifications <span id="count-notifs" class="mono">0</span></button>
              <button type="button" class="tab-btn" data-tab="settings">Profile Settings</button>
            </nav>
          </aside>

          <section id="customer-panel" aria-live="polite">
            <div class="skeleton" style="height:260px;"></div>
          </section>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="/js/customer-dashboard.js"></script>
  </body>
</html>
