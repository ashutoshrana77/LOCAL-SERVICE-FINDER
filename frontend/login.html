<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — Local Service Finder</title>
    <meta name="description" content="Sign in to manage bookings, quote requests, saved providers, or your service provider studio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <header id="site-header"></header>

    <main>
      <div class="container">
        <div class="auth-shell">
          <div class="card">
            <h1 style="font-size:1.625rem;">Log in to your account</h1>
            <p class="muted" style="margin-top:6px;font-size:0.875rem;">Access your bookings, quotes, messages, or provider dashboard.</p>

            <form id="login-form" style="display:flex;flex-direction:column;gap:14px;margin-top:20px;" novalidate>
              <div class="form-group">
                <label for="login-email" class="form-label">Email Address</label>
                <input id="login-email" type="email" class="input" placeholder="you@example.in" required autocomplete="email" />
              </div>

              <div class="form-group">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <label for="login-password" class="form-label">Password</label>
                  <button type="button" id="forgot-password-btn" class="btn-ghost" style="border:none;font-size:0.75rem;cursor:pointer;padding:0;">Forgot password?</button>
                </div>
                <input id="login-password" type="password" class="input" placeholder="Enter your password" required autocomplete="current-password" />
              </div>

              <div id="login-error" class="alert-banner alert-error" style="display:none;"></div>

              <button type="submit" id="login-submit-btn" class="btn btn-primary">Log In</button>
            </form>

            <p class="muted" style="margin-top:16px;font-size:0.875rem;text-align:center;">
              New to Local Service Finder? <a href="/register.html" style="color:var(--accent-primary);font-weight:600;">Create an account</a>
            </p>
          </div>

          <section class="demo-accounts-box" aria-label="Demo login credentials">
            <h2 style="font-size:0.9375rem;margin-bottom:10px;">Demo Evaluation Accounts</h2>
            <div style="display:flex;flex-direction:column;gap:10px;font-size:0.8125rem;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                <div>
                  <strong>Customer</strong> — <span class="mono muted">ananya.sharma@example.in</span>
                </div>
                <button type="button" class="btn btn-secondary btn-sm fill-demo-btn" data-email="ananya.sharma@example.in" data-pass="Customer@123">Fill</button>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                <div>
                  <strong>Provider</strong> — <span class="mono muted">rajesh.plumbing@example.in</span>
                </div>
                <button type="button" class="btn btn-secondary btn-sm fill-demo-btn" data-email="rajesh.plumbing@example.in" data-pass="Provider@123">Fill</button>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                <div>
                  <strong>Admin</strong> — <span class="mono muted">admin@localservicefinder.in</span>
                </div>
                <button type="button" class="btn btn-secondary btn-sm fill-demo-btn" data-email="admin@localservicefinder.in" data-pass="Admin@123">Fill</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="/js/auth-pages.js"></script>
  </body>
</html>
